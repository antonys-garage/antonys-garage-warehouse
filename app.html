<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Antony's Garage Warehouse</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="banner">
  <div class="bannerInner">
    <img src="assets/logo.png" alt="Antony's Garage" class="logo">
    <div>
      <h1>Antony's Garage Warehouse</h1>
      <div class="tag">Source smarter, build faster</div>
    </div>
  </div>
</div>
<div class="wrap">
  <div class="searchbar">
    <input type="text" id="query" placeholder="e.g. ESP32-S3, RDA5807M, MAX7219 module...">
    <button class="primary" id="doSearch">Search</button>
  </div>
  <div class="chips" id="historyChips" style="display:none"></div>
  <div class="selCount" id="selCount"></div>

  <div class="accordion" id="wishAccordion">
    <button class="accHeader" id="wishToggle">
      <span id="wishSummary">♡ Wishlist (0)</span>
      <span class="chev" id="wishChev">▸</span>
    </button>
    <div class="prodgrid" id="wishGrid" style="display:none"></div>
  </div>

  <div class="toolbar">
    <input type="text" id="filterBox" placeholder="Filter store list...">
    <select id="storeSortSel">
      <option value="name-asc">Name A–Z</option>
      <option value="name-desc">Name Z–A</option>
      <option value="recent">Recently added</option>
      <option value="used">Most searched</option>
    </select>
    <button class="small" id="selAll">Select all</button>
    <button class="small" id="selNone">Select none</button>
    <span style="flex:1"></span>
    <button class="small" id="exportBtn" title="Download your stores + wishlist as a JSON file">Export backup</button>
    <button class="small" id="importBtn" title="Restore stores + wishlist from a JSON file">Import backup</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <button class="small" id="toggleAdd">+ Add store</button>
    <button class="small" id="toggleManage">Manage stores ▾</button>
  </div>

  <div class="addbox" id="addBox" style="display:none">
    <div class="row">
      <input type="text" id="newName" placeholder="Store name">
      <input type="text" id="newUrl" placeholder="Store URL (e.g. https://example.com/)">
    </div>
    <div class="note" style="margin-top:0">Adding a new store will ask Chrome's permission to access that site — needed so this extension can read its search results.</div>
    <button class="primary small" id="saveNew">Add &amp; grant access</button>
    <button class="small" id="cancelNew">Cancel</button>
  </div>

  <div class="grid" id="grid" style="display:none"></div>

  <div class="accordion" id="statusAccordion" style="display:none">
    <button class="accHeader" id="statusToggle">
      <span id="statusSummary">Store status</span>
      <span class="chev" id="statusChev">▸</span>
    </button>
    <div class="statusline" id="statusline" style="display:none"></div>
  </div>

  <div class="resultsbar" id="resultsbar" style="display:none">
    <span id="resultCount" class="sub"></span>
    <div class="priceFilter">
      <span class="sub">₹</span>
      <input type="number" id="minPrice" placeholder="Min" min="0">
      <span class="sub">–</span>
      <input type="number" id="maxPrice" placeholder="Max" min="0">
    </div>
    <select id="prodSortSel">
      <option value="price-asc">Price: Low to High</option>
      <option value="price-desc">Price: High to Low</option>
      <option value="store">Store name</option>
      <option value="title">Product title</option>
    </select>
  </div>

  <div class="prodgrid" id="prodgrid"></div>
</div>
<script src="app.js"></script>
</body>
</html>
